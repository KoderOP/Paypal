services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora
      POSTGRES_DB: finora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://finora:finora@db:5432/finora
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
